[project]
name = "follow-the-money"
version = "0.1.0"
description = "Who really controls a company? Build a knowledge graph from real open registers, then an agent that screens suppliers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "model2vec>=0.6",
    "neo4j>=6.4.1",
    "networkx>=3.3",
    "numpy>=1.26",
    "openai>=3.51.0",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.14.6",
]

[project.scripts]
trail = "trail.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trail"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905", "E501"]  # zip() over a list and its own tail is fine; the formatter owns line length

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
